<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Polls - Admin | Village Connect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        nav {
            background: #12372a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        nav h2 {
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a,
        .logout-btn {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.15);
        }

        .logout-btn {
            background: #dc3545;
            border: none;
        }

        .container {
            width: 94%;
            max-width: 1300px;
            margin: 25px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .header h1 {
            color: #12372a;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
            color: #12372a;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-bottom: 20px;
            color: #12372a;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #198754;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-row {
            display: flex;
            gap: 10px;
        }

        .option-row input {
            flex: 1;
        }

        .remove-option {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        .add-option {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: fit-content;
        }

        .submit-btn {
            background: #198754;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 8px;
        }

        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error {
            background: #f8d7da;
            color: #842029;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .poll-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .poll-card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            background: #fff;
        }

        .poll-card h3 {
            color: #12372a;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .poll-meta {
            color: #666;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.7;
        }

        .option-result {
            margin-bottom: 10px;
        }

        .option-header {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .progress {
            height: 8px;
            background: #e9ecef;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: #198754;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .actions button {
            border: none;
            padding: 9px 13px;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .view-btn {
            background: #0d6efd;
        }

        .edit-btn {
            background: #fd7e14;
        }

        .delete-btn {
            background: #dc3545;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #777;
            grid-column: 1 / -1;
        }

        @media (max-width: 800px) {
            .stats,
            .poll-list,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<nav>
    <h2>Village Connect - Admin</h2>

    <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="complaints.html">Complaints</a>
        <a href="villages.html">Villages</a>
        <a href="events.html">Events</a>
        <a href="polls.html">Polls</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container">

    <div class="header">
        <div>
            <h1>Poll Management</h1>
            <p>Create and manage community polls.</p>
        </div>
    </div>

    <div class="stats">

        <div class="stat-card">
            <h3>Total Polls</h3>
            <p id="totalPolls">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Votes</h3>
            <p id="totalVotes">0</p>
        </div>

        <div class="stat-card">
            <h3>Villages Covered</h3>
            <p id="villagesCovered">0</p>
        </div>

    </div>

    <div id="message" class="message"></div>

    <!-- CREATE / EDIT POLL -->

    <div class="panel">

        <h2 id="formTitle">Create New Poll</h2>

        <form id="pollForm">

            <div class="form-grid">

                <div class="form-group full">
                    <label for="question">
                        Poll Question
                    </label>

                    <input
                        type="text"
                        id="question"
                        placeholder="Enter poll question"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="village">
                        Village
                    </label>

                    <select id="village">
                        <option value="">
                            All Villages
                        </option>
                    </select>
                </div>

                <div></div>

                <div class="form-group full">

                    <label>
                        Poll Options
                    </label>

                    <div
                        id="optionsContainer"
                        class="options-container"
                    >

                        <div class="option-row">
                            <input
                                type="text"
                                class="option-input"
                                placeholder="Option 1"
                                required
                            >

                            <button
                                type="button"
                                class="remove-option"
                                onclick="removeOption(this)"
                            >
                                Remove
                            </button>
                        </div>

                        <div class="option-row">
                            <input
                                type="text"
                                class="option-input"
                                placeholder="Option 2"
                                required
                            >

                            <button
                                type="button"
                                class="remove-option"
                                onclick="removeOption(this)"
                            >
                                Remove
                            </button>
                        </div>

                    </div>

                    <button
                        type="button"
                        class="add-option"
                        onclick="addOption()"
                    >
                        + Add Option
                    </button>

                </div>

            </div>

            <br>

            <button
                type="submit"
                class="submit-btn"
            >
                Save Poll
            </button>

            <button
                type="button"
                class="cancel-btn"
                id="cancelBtn"
                onclick="resetForm()"
                style="display:none;"
            >
                Cancel Edit
            </button>

        </form>

    </div>

    <!-- POLL LIST -->

    <div class="panel">

        <h2>All Polls</h2>

        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Search polls..."
                oninput="filterPolls()"
            >

        </div>

        <div
            id="pollList"
            class="poll-list"
        ></div>

    </div>

</div>

<script>

const API = "/api";

const token = localStorage.getItem("token");

let polls = [];

let editingPollId = null;


// ===============================
// AUTH CHECK
// ===============================

if (!token) {
    window.location.href = "login.html";
}


// ===============================
// LOGOUT
// ===============================

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    window.location.href = "login.html";
}


// ===============================
// API HEADERS
// ===============================

function headers() {

    return {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
    };
}


// ===============================
// MESSAGE
// ===============================

function showMessage(message, type) {

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.className =
        `message ${type}`;

    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 3500);
}


// ===============================
// LOAD VILLAGES
// ===============================

async function loadVillages() {

    try {

        const response =
            await fetch(
                `${API}/villages`,
                {
                    headers: headers()
                }
            );

        const data =
            await response.json();

        if (!data.success) {
            return;
        }

        const select =
            document.getElementById("village");

        data.villages.forEach(village => {

            const option =
                document.createElement("option");

            option.value = village.id;

            option.textContent =
                village.name;

            select.appendChild(option);
        });

    } catch (error) {

        console.error(
            "Load villages error:",
            error
        );
    }
}


// ===============================
// LOAD POLLS
// ===============================

async function loadPolls() {

    try {

        const response =
            await fetch(
                `${API}/polls`,
                {
                    headers: headers()
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            showMessage(
                data.message ||
                "Unable to load polls",
                "error"
            );

            return;
        }

        polls = data.polls || [];

        updateStats();

        renderPolls(polls);

    } catch (error) {

        console.error(
            "Load polls error:",
            error
        );

        showMessage(
            "Unable to connect to server",
            "error"
        );
    }
}


// ===============================
// UPDATE STATS
// ===============================

function updateStats() {

    const totalPolls =
        polls.length;

    const totalVotes =
        polls.reduce(
            (sum, poll) =>
                sum + Number(poll.total_votes || 0),
            0
        );

    const villages =
        new Set(
            polls
                .filter(poll => poll.village_id)
                .map(poll => poll.village_id)
        );

    document.getElementById(
        "totalPolls"
    ).textContent = totalPolls;

    document.getElementById(
        "totalVotes"
    ).textContent = totalVotes;

    document.getElementById(
        "villagesCovered"
    ).textContent = villages.size;
}


// ===============================
// RENDER POLLS
// ===============================

async function renderPolls(list) {

    const container =
        document.getElementById("pollList");

    if (list.length === 0) {

        container.innerHTML = `
            <div class="empty">
                No polls found.
            </div>
        `;

        return;
    }

    container.innerHTML = `
        <div class="empty">
            Loading poll details...
        </div>
    `;

    const detailedPolls = [];

    for (const poll of list) {

        try {

            const response =
                await fetch(
                    `${API}/polls/${poll.id}`,
                    {
                        headers: headers()
                    }
                );

            const data =
                await response.json();

            if (data.success) {
                detailedPolls.push(data);
            }

        } catch (error) {

            console.error(
                "Poll details error:",
                error
            );
        }
    }

    container.innerHTML = "";

    detailedPolls.forEach(data => {

        const poll =
            data.poll;

        const options =
            data.options || [];

        const totalVotes =
            options.reduce(
                (sum, option) =>
                    sum + Number(option.vote_count || 0),
                0
            );

        const card =
            document.createElement("div");

        card.className =
            "poll-card";

        let optionsHTML = "";

        options.forEach(option => {

            const votes =
                Number(option.vote_count || 0);

            const percentage =
                totalVotes > 0
                    ? Math.round(
                        (votes / totalVotes) * 100
                    )
                    : 0;

            optionsHTML += `
                <div class="option-result">

                    <div class="option-header">

                        <span>
                            ${escapeHTML(
                                option.option_text
                            )}
                        </span>

                        <span>
                            ${votes} vote(s)
                            (${percentage}%)
                        </span>

                    </div>

                    <div class="progress">
                        <div
                            class="progress-bar"
                            style="width:${percentage}%"
                        ></div>
                    </div>

                </div>
            `;
        });

        card.innerHTML = `

            <h3>
                ${escapeHTML(poll.question)}
            </h3>

            <div class="poll-meta">

                <div>
                    <strong>Village:</strong>
                    ${escapeHTML(
                        poll.village_name ||
                        "All Villages"
                    )}
                </div>

                <div>
                    <strong>Options:</strong>
                    ${options.length}
                </div>

                <div>
                    <strong>Total Votes:</strong>
                    ${totalVotes}
                </div>

                <div>
                    <strong>Created:</strong>
                    ${formatDate(poll.created_at)}
                </div>

            </div>

            ${optionsHTML}

            <div class="actions">

                <button
                    class="view-btn"
                    onclick="viewPoll(${poll.id})"
                >
                    View
                </button>

                <button
                    class="edit-btn"
                    onclick="editPoll(${poll.id})"
                >
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deletePoll(${poll.id})"
                >
                    Delete
                </button>

            </div>
        `;

        container.appendChild(card);
    });
}


// ===============================
// ADD OPTION
// ===============================

function addOption() {

    const container =
        document.getElementById(
            "optionsContainer"
        );

    const count =
        container.querySelectorAll(
            ".option-row"
        ).length + 1;

    const row =
        document.createElement("div");

    row.className =
        "option-row";

    row.innerHTML = `

        <input
            type="text"
            class="option-input"
            placeholder="Option ${count}"
            required
        >

        <button
            type="button"
            class="remove-option"
            onclick="removeOption(this)"
        >
            Remove
        </button>
    `;

    container.appendChild(row);
}


// ===============================
// REMOVE OPTION
// ===============================

function removeOption(button) {

    const container =
        document.getElementById(
            "optionsContainer"
        );

    const rows =
        container.querySelectorAll(
            ".option-row"
        );

    if (rows.length <= 2) {

        showMessage(
            "A poll must have at least two options.",
            "error"
        );

        return;
    }

    button
        .closest(".option-row")
        .remove();
}


// ===============================
// CREATE / UPDATE POLL
// ===============================

document
    .getElementById("pollForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const question =
                document
                    .getElementById("question")
                    .value
                    .trim();

            const villageId =
                document
                    .getElementById("village")
                    .value;

            const optionInputs =
                document.querySelectorAll(
                    ".option-input"
                );

            const options =
                Array.from(optionInputs)
                    .map(input =>
                        input.value.trim()
                    )
                    .filter(value =>
                        value.length > 0
                    );

            if (!question) {

                showMessage(
                    "Enter a poll question.",
                    "error"
                );

                return;
            }

            if (options.length < 2) {

                showMessage(
                    "Add at least two options.",
                    "error"
                );

                return;
            }

            const body = {

                question,

                village_id:
                    villageId
                        ? Number(villageId)
                        : null,

                options
            };

            try {

                let response;

                if (editingPollId) {

                    response =
                        await fetch(
                            `${API}/polls/${editingPollId}`,
                            {
                                method: "PUT",
                                headers: headers(),
                                body: JSON.stringify(body)
                            }
                        );

                } else {

                    response =
                        await fetch(
                            `${API}/polls`,
                            {
                                method: "POST",
                                headers: headers(),
                                body: JSON.stringify(body)
                            }
                        );
                }

                const data =
                    await response.json();

                if (!response.ok ||
                    !data.success) {

                    showMessage(
                        data.message ||
                        "Unable to save poll.",
                        "error"
                    );

                    return;
                }

                showMessage(
                    editingPollId
                        ? "Poll updated successfully."
                        : "Poll created successfully.",
                    "success"
                );

                resetForm();

                await loadPolls();

            } catch (error) {

                console.error(
                    "Save poll error:",
                    error
                );

                showMessage(
                    "Unable to connect to server.",
                    "error"
                );
            }
        }
    );


// ===============================
// EDIT POLL
// ===============================

async function editPoll(id) {

    try {

        const response =
            await fetch(
                `${API}/polls/${id}`,
                {
                    headers: headers()
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            showMessage(
                "Unable to load poll.",
                "error"
            );

            return;
        }

        editingPollId =
            id;

        document.getElementById(
            "formTitle"
        ).textContent =
            "Edit Poll";

        document.getElementById(
            "question"
        ).value =
            data.poll.question;

        document.getElementById(
            "village"
        ).value =
            data.poll.village_id || "";

        const container =
            document.getElementById(
                "optionsContainer"
            );

        container.innerHTML = "";

        data.options.forEach(
            (option, index) => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "option-row";

                row.innerHTML = `

                    <input
                        type="text"
                        class="option-input"
                        value="${escapeAttribute(
                            option.option_text
                        )}"
                        placeholder="Option ${index + 1}"
                        required
                    >

                    <button
                        type="button"
                        class="remove-option"
                        onclick="removeOption(this)"
                    >
                        Remove
                    </button>
                `;

                container.appendChild(row);
            }
        );

        document.getElementById(
            "cancelBtn"
        ).style.display =
            "inline-block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } catch (error) {

        console.error(
            "Edit poll error:",
            error
        );
    }
}


// ===============================
// RESET FORM
// ===============================

function resetForm() {

    editingPollId = null;

    document.getElementById(
        "formTitle"
    ).textContent =
        "Create New Poll";

    document.getElementById(
        "pollForm"
    ).reset();

    const container =
        document.getElementById(
            "optionsContainer"
        );

    container.innerHTML = `

        <div class="option-row">

            <input
                type="text"
                class="option-input"
                placeholder="Option 1"
                required
            >

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)"
            >
                Remove
            </button>

        </div>

        <div class="option-row">

            <input
                type="text"
                class="option-input"
                placeholder="Option 2"
                required
            >

            <button
                type="button"
                class="remove-option"
                onclick="removeOption(this)"
            >
                Remove
            </button>

        </div>
    `;

    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";
}


// ===============================
// DELETE POLL
// ===============================

async function deletePoll(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this poll?"
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                `${API}/polls/${id}`,
                {
                    method: "DELETE",
                    headers: headers()
                }
            );

        const data =
            await response.json();

        if (!response.ok ||
            !data.success) {

            showMessage(
                data.message ||
                "Unable to delete poll.",
                "error"
            );

            return;
        }

        showMessage(
            "Poll deleted successfully.",
            "success"
        );

        await loadPolls();

    } catch (error) {

        console.error(
            "Delete poll error:",
            error
        );

        showMessage(
            "Unable to connect to server.",
            "error"
        );
    }
}


// ===============================
// VIEW POLL
// ===============================

function viewPoll(id) {

    window.location.href =
        `../polls.html?id=${id}`;
}


// ===============================
// SEARCH
// ===============================

function filterPolls() {

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const filtered =
        polls.filter(poll => {

            const question =
                String(
                    poll.question || ""
                ).toLowerCase();

            const village =
                String(
                    poll.village_name || ""
                ).toLowerCase();

            return (
                question.includes(search) ||
                village.includes(search)
            );
        });

    renderPolls(filtered);
}


// ===============================
// FORMAT DATE
// ===============================

function formatDate(date) {

    if (!date) {
        return "-";
    }

    return new Date(date)
        .toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );
}


// ===============================
// HTML ESCAPE
// ===============================

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

    return escapeHTML(value);
}
