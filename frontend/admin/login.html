<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Village Connect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Admin Login</h1>

        <p class="subtitle">
            Village Connect Official Portal
        </p>

        <form id="loginForm">

            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="text"
                id="mobile"
                placeholder="Enter mobile number"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <a href="../index.html" class="back">
            ← Back to Village Connect
        </a>

    </div>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const message =
        document.getElementById("message");


    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const mobile =
            document.getElementById("mobile").value.trim();

        const password =
            document.getElementById("password").value;


        message.textContent = "Logging in...";
        message.style.color = "#555";


        try {

            const response = await fetch(
                "/api/auth/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        mobile: mobile,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                message.textContent =
                    data.message || "Login failed";

                message.style.color = "red";

                return;
            }


            /*
             * Only officials/admins should enter
             * the official dashboard.
             */

            if (
                data.user.role !== "official" &&
                data.user.role !== "admin"
            ) {

                message.textContent =
                    "This account does not have official access.";

                message.style.color = "red";

                return;
            }


            // Save login information
            localStorage.setItem(
                "token",
                data.token
            );

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            );


            message.textContent =
                "Login successful. Opening dashboard...";

            message.style.color = "green";


            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 500);


        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to server.";

            message.style.color = "red";

        }

    });

</script>

</body>
</html>
