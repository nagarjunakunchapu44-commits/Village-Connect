<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Village Connect - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            color: #243b2a;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        nav {
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid #e4e0d7;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 22px;
            font-weight: bold;

            color: #245c35;
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;

            background: #2f7d46;
            color: white;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            text-decoration: none;

            padding: 10px 18px;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;
        }

        .register-btn {
            background: #2f7d46;
            color: white;
        }

        .home-btn {
            color: #2f7d46;
            border: 1px solid #2f7d46;
        }

        /* ================= MAIN ================= */

        .page {
            min-height: calc(100vh - 70px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.08);

            border: 1px solid #e8e4da;
        }

        .login-icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #e6f2e8;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        h1 {
            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;

            color: #234f2d;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            font-weight: 600;

            color: #354b39;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d7d7d0;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            background: #fff;
        }

        input:focus {
            border-color: #2f7d46;

            box-shadow:
                0 0 0 3px rgba(47, 125, 70, 0.10);
        }

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #2f7d46;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .login-button:hover {
            background: #256538;
        }

        .login-button:disabled {
            background: #8aa994;
            cursor: not-allowed;
        }

        /* ================= MESSAGE ================= */

        #message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 8px;

            font-size: 14px;

            text-align: center;
        }

        #message.error {
            display: block;

            background: #fdeaea;

            color: #b42318;

            border: 1px solid #f5c2c0;
        }

        #message.success {
            display: block;

            background: #e9f7ed;

            color: #256538;

            border: 1px solid #b9dfc1;
        }

        /* ================= REGISTER LINK ================= */

        .register-text {
            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #777;
        }

        .register-text a {
            color: #2f7d46;

            font-weight: bold;

            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* ================= FOOTER ================= */

        footer {
            text-align: center;

            padding: 20px;

            font-size: 12px;

            color: #888;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            .home-btn {
                display: none;
            }

            .login-card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <a
            href="index.html"
            class="logo"
        >

            <div class="logo-icon">
                V
            </div>

            <span>
                Village Connect
            </span>

        </a>


        <div class="nav-buttons">

            <a
                href="index.html"
                class="nav-btn home-btn"
            >
                Home
            </a>

            <a
                href="register.html"
                class="nav-btn register-btn"
            >
                Register
            </a>

        </div>

    </nav>



    <!-- ================= LOGIN ================= -->

    <main class="page">

        <div class="login-card">


            <div class="login-icon">
                🔐
            </div>


            <h1>
                Welcome Back
            </h1>


            <p class="subtitle">
                Login to your Village Connect account
            </p>


            <form id="loginForm">


                <!-- MOBILE -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter your mobile number"
                        maxlength="15"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    Login
                </button>


            </form>



            <!-- MESSAGE -->

            <div id="message"></div>



            <!-- REGISTER -->

            <div class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </div>


        </div>

    </main>



    <footer>

        Village Connect © 2026

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        // --------------------------------------------------
        // Show message
        // --------------------------------------------------

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                type;

        }


        // --------------------------------------------------
        // Login
        // --------------------------------------------------

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const mobile =
                    document
                        .getElementById("mobile")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!mobile || !password) {

                    showMessage(
                        "Please enter mobile number and password.",
                        "error"
                    );

                    return;

                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Logging in...";


                try {

                    const response =
                        await fetch(
                            "/api/auth/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        mobile:
                                            mobile,

                                        password:
                                            password

                                    })

                            }
                        );


                    const data =
                        await response.json();


                    // ------------------------------------------------
                    // Login failed
                    // ------------------------------------------------

                    if (!response.ok || !data.success) {

                        showMessage(
                            data.message ||
                            "Login failed. Please check your details.",
                            "error"
                        );

                        loginButton.disabled =
                            false;

                        loginButton.textContent =
                            "Login";

                        return;

                    }


                    // ------------------------------------------------
                    // Save authentication data
                    // ------------------------------------------------

                    localStorage.setItem(
                        "token",
                        data.token
                    );


                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );


                    // ------------------------------------------------
                    // Success message
                    // ------------------------------------------------

                    showMessage(
                        "Login successful. Redirecting...",
                        "success"
                    );


                    // ------------------------------------------------
                    // IMPORTANT:
                    // Go to HOME, NOT register.html
                    // ------------------------------------------------

                    setTimeout(
                        function () {

                            window.location.href =
                                "home.html";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(
                        "Unable to connect to the server. Make sure the backend is running.",
                        "error"
                    );


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>


</body>

</html>
