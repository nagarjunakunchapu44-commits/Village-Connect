<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Connect - Polls</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            color: #234b35;
        }

        .page-header p {
            margin: 0;
            color: #666;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .toolbar input,
        .toolbar select {
            flex: 1;
            min-width: 180px;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .poll-list {
            display: grid;
            gap: 18px;
        }

        .poll-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .poll-card h3 {
            margin: 0 0 10px;
            color: #234b35;
        }

        .poll-meta {
            color: #777;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .poll-question {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .poll-options {
            display: grid;
            gap: 10px;
            margin: 15px 0;
        }

        .poll-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            cursor: pointer;
            background: #fff;
        }

        .poll-option:hover {
            background: #f5faf6;
            border-color: #398451;
        }

        .poll-option input {
            cursor: pointer;
        }

        .poll-option.selected {
            border-color: #398451;
            background: #eef8f0;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 11px 18px;
            background: #287a43;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1f6235;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .vote-button {
            margin-top: 8px;
        }

        .results {
            margin-top: 15px;
        }

        .result-item {
            margin: 12px 0;
        }

        .result-label {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .result-bar {
            height: 10px;
            background: #e6e6e6;
            border-radius: 10px;
            overflow: hidden;
        }

        .result-fill {
            height: 100%;
            background: #398451;
            border-radius: 10px;
            width: 0;
        }

        .my-vote {
            margin-top: 12px;
            padding: 10px;
            background: #eef8f0;
            color: #246b38;
            border-radius: 6px;
            font-size: 14px;
        }

        .message {
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fdecec;
            color: #a12626;
        }

        .message.success {
            display: block;
            background: #eaf7ed;
            color: #246b38;
        }

        .empty-state {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #666;
        }

        .create-toolbar { display:flex; justify-content:flex-end; margin-bottom:18px; }
        .create-btn { background:#287a43; color:#fff; border:0; border-radius:7px; padding:12px 18px; cursor:pointer; font-weight:700; }
        .create-panel { display:none; background:#fff; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.07); }
        .create-panel.open { display:block; }
        .create-panel h2 { margin-top:0; color:#234b35; }
        .create-panel label { display:block; font-weight:600; margin:12px 0 5px; }
        .create-panel input,.create-panel select { width:100%; padding:11px; border:1px solid #ccc; border-radius:6px; }
        .option-row { display:flex; gap:8px; align-items:center; margin:8px 0; }
        .option-row input { flex:1; }
        .option-row button { flex:0 0 auto; background:#9b2c2c; padding:9px 12px; }
        .create-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:15px; }
        .secondary-btn { background:#64748b; }
        .create-hint { color:#64748b; font-size:13px; }
        @media (max-width: 600px) {
            .container {
                margin: 10px auto;
                padding: 12px;
            }

            .poll-card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>Village Polls</h1>
            <p>Share your opinion and vote on important village matters.</p>
        </header>

        <div id="messageBox" class="message"></div>

        <div class="create-toolbar" id="createPollToolbar" style="display:none;">
            <button type="button" class="create-btn" id="showCreatePoll">+ Create Poll</button>
        </div>

        <section class="create-panel" id="createPollPanel">
            <h2>Create a Village Poll</h2>
            <form id="createPollForm">
                <label for="newPollQuestion">Poll question *</label>
                <input id="newPollQuestion" maxlength="500" required placeholder="Enter your question">
                <div id="newPollOptions">
                    <label>Answer options * (minimum 2)</label>
                    <div class="option-row"><input class="new-poll-option" maxlength="180" required placeholder="Option 1"></div>
                    <div class="option-row"><input class="new-poll-option" maxlength="180" required placeholder="Option 2"></div>
                </div>
                <button type="button" class="secondary-btn" id="addPollOption">+ Add option</button>
                <div id="pollVillageWrap" style="display:none;">
                    <label for="pollVillage">Village</label>
                    <select id="pollVillage"><option value="">All villages</option></select>
                </div>
                <p class="create-hint" id="pollVillageHint">Village officials and approved volunteers can create polls only for their own village.</p>
                <div class="create-actions">
                    <button type="submit" class="create-btn" id="savePollButton">Create Poll</button>
                    <button type="button" class="secondary-btn" id="cancelCreatePoll">Cancel</button>
                </div>
            </form>
        </section>

        <div class="toolbar">
            <input
                type="text"
                id="searchInput"
                placeholder="Search polls..."
            >

            <select id="statusFilter">
                <option value="all">All Polls</option>
                <option value="not-voted">Not Voted</option>
                <option value="voted">Voted</option>
            </select>
        </div>

        <section id="pollList" class="poll-list">
            <div class="loading">Loading polls...</div>
        </section>
    </main>

    <script>
        const API = "/api";

        const token = localStorage.getItem("token");

        let allPolls = [];

        const pollList = document.getElementById("pollList");
        const messageBox = document.getElementById("messageBox");
        const searchInput = document.getElementById("searchInput");
        const statusFilter = document.getElementById("statusFilter");

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (char) {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return entities[char];
            });
        }

        function showMessage(message, type = "success") {
            messageBox.textContent = message;
            messageBox.className = "message " + type;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            setTimeout(() => {
                messageBox.className = "message";
                messageBox.textContent = "";
            }, 4000);
        }

        async function apiRequest(url, options = {}) {
            if (!token) {
                throw new Error("Please log in to continue.");
            }

            const response = await fetch(API + url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token,
                    ...(options.headers || {})
                }
            });

            let data;

            try {
                data = await response.json();
            } catch {
                data = {};
            }

            if (!response.ok || data.success === false) {
                throw new Error(
                    data.message || data.error || "Something went wrong."
                );
            }

            return data;
        }

        async function loadPolls() {
            pollList.innerHTML = '<div class="loading">Loading polls...</div>';

            try {
                const response = await apiRequest("/polls");

                const polls = response.polls || response.data || [];

                if (!Array.isArray(polls)) {
                    throw new Error("Invalid polls response from server.");
                }

                const detailedPolls = [];

                for (const poll of polls) {
                    try {
                        const detailData = await apiRequest(
                            "/polls/" + encodeURIComponent(poll.id)
                        );

                        const fullPoll = detailData.poll || poll;

                        let voteData = {
                            success: true,
                            voted: false,
                            vote: null
                        };

                        try {
                            voteData = await apiRequest(
                                "/polls/" +
                                encodeURIComponent(poll.id) +
                                "/my-vote"
                            );
                        } catch (error) {
                            console.warn(
                                "Could not load user's vote for poll:",
                                poll.id,
                                error
                            );
                        }

                        detailedPolls.push({
                            poll: fullPoll,
                            options: fullPoll.options || [],
                            myVote: voteData.success
                                ? voteData
                                : { voted: false, vote: null }
                        });
                    } catch (error) {
                        console.error(
                            "Could not load poll:",
                            poll.id,
                            error
                        );
                    }
                }

                allPolls = detailedPolls;
                renderPolls();
            } catch (error) {
                console.error(error);

                pollList.innerHTML = `
                    <div class="empty-state">
                        ${escapeHTML(error.message)}
                    </div>
                `;
            }
        }

        function renderPolls() {
            const searchText = searchInput.value.trim().toLowerCase();
            const filter = statusFilter.value;

            const filteredPolls = allPolls.filter(item => {
                const poll = item.poll;
                const voted = Boolean(item.myVote?.voted);

                const matchesSearch =
                    String(poll.question || "")
                        .toLowerCase()
                        .includes(searchText);

                const matchesFilter =
                    filter === "all" ||
                    (filter === "voted" && voted) ||
                    (filter === "not-voted" && !voted);

                return matchesSearch && matchesFilter;
            });

            if (filteredPolls.length === 0) {
                pollList.innerHTML = `
                    <div class="empty-state">
                        No polls found.
                    </div>
                `;
                return;
            }

            pollList.innerHTML = filteredPolls
                .map(createPollCard)
                .join("");
        }

        function createPollCard(item) {
            const poll = item.poll;

            // The backend returns options inside data.poll.options.
            const options = item.options || poll.options || [];

            const myVote = item.myVote || {
                voted: false,
                vote: null
            };

            const voted = Boolean(myVote.voted);

            const totalVotes = options.reduce((total, option) => {
                return total + Number(option.vote_count || 0);
            }, 0);

            const pollQuestion = escapeHTML(poll.question || "Untitled poll");

            const villageName = escapeHTML(
                poll.village_name || "Village"
            );

            const createdAt = poll.created_at
                ? new Date(poll.created_at).toLocaleDateString()
                : "";

            let optionsHTML = "";

            if (!Array.isArray(options) || options.length === 0) {
                optionsHTML = `
                    <p class="empty-state">
                        No voting options are available for this poll.
                    </p>
                `;
            } else if (!voted) {
                optionsHTML = `
                    <div class="poll-options" id="options-${poll.id}">
                        ${options.map(option => `
                            <label class="poll-option">
                                <input
                                    type="radio"
                                    name="poll-${poll.id}"
                                    value="${option.id}"
                                    onchange="selectOption(${poll.id}, this)"
                                >
                                <span>${escapeHTML(option.option_text)}</span>
                            </label>
                        `).join("")}
                    </div>
                `;
            } else {
                optionsHTML = renderResults(options, totalVotes);
            }

            const voteButtonHTML =
                !voted && options.length > 0
                    ? `
                        <button
                            class="vote-button"
                            id="vote-button-${poll.id}"
                            onclick="submitVote(${poll.id})"
                        >
                            Submit Vote
                        </button>
                    `
                    : "";

            const myVoteHTML = voted
                ? `
                    <div class="my-vote">
                        You have already voted in this poll.
                    </div>
                `
                : "";

            return `
                <article class="poll-card">
                    <h3>${pollQuestion}</h3>

                    <div class="poll-meta">
                        Village: ${villageName}
                        ${createdAt ? " | Created: " + escapeHTML(createdAt) : ""}
                    </div>

                    <div class="poll-question">
                        ${pollQuestion}
                    </div>

                    ${optionsHTML}

                    ${voteButtonHTML}

                    ${myVoteHTML}

                    <div class="poll-meta" style="margin-top: 15px;">
                        Total votes: ${totalVotes}
                    </div>
                </article>
            `;
        }

        function renderResults(options, totalVotes) {
            return `
                <div class="results">
                    ${options.map(option => {
                        const count = Number(option.vote_count || 0);

                        const percentage = totalVotes > 0
                            ? Math.round((count / totalVotes) * 100)
                            : 0;

                        return `
                            <div class="result-item">
                                <div class="result-label">
                                    <span>${escapeHTML(option.option_text)}</span>
                                    <span>${count} vote(s) - ${percentage}%</span>
                                </div>

                                <div class="result-bar">
                                    <div
                                        class="result-fill"
                                        style="width: ${percentage}%"
                                    ></div>
                                </div>
                            </div>
                        `;
                    }).join("")}
                </div>
            `;
        }

        function selectOption(pollId, selectedInput) {
            const optionsContainer = document.getElementById(
                "options-" + pollId
            );

            if (!optionsContainer) return;

            optionsContainer
                .querySelectorAll(".poll-option")
                .forEach(label => {
                    label.classList.remove("selected");
                });

            selectedInput.closest(".poll-option")
                ?.classList.add("selected");
        }

        async function submitVote(pollId) {
            const selectedOption = document.querySelector(
                `input[name="poll-${pollId}"]:checked`
            );

            if (!selectedOption) {
                showMessage(
                    "Please select an option before voting.",
                    "error"
                );
                return;
            }

            const button = document.getElementById(
                "vote-button-" + pollId
            );

            if (button) {
                button.disabled = true;
                button.textContent = "Submitting...";
            }

            try {
                await apiRequest(
                    "/polls/" + encodeURIComponent(pollId) + "/vote",
                    {
                        method: "POST",
                        body: JSON.stringify({
                            option_id: Number(selectedOption.value)
                        })
                    }
                );

                showMessage("Your vote has been submitted successfully.");

                await loadPolls();
            } catch (error) {
                showMessage(error.message, "error");

                if (button) {
                    button.disabled = false;
                    button.textContent = "Submit Vote";
                }
            }
        }


        // ------------------------------------------------------------
        // POLL CREATION: admins can select a village or All villages.
        // Approved volunteers and officials are village-restricted by API.
        // ------------------------------------------------------------
        const createPollToolbar = document.getElementById("createPollToolbar");
        const createPollPanel = document.getElementById("createPollPanel");
        const createPollForm = document.getElementById("createPollForm");
        const pollVillageWrap = document.getElementById("pollVillageWrap");
        const pollVillageSelect = document.getElementById("pollVillage");
        const newPollOptions = document.getElementById("newPollOptions");

        async function setupPollCreator() {
            try {
                const meData = await apiRequest("/auth/me");
                const user = meData.user || {};
                const role = String(user.role || "").toLowerCase();
                let allowed = role === "admin" || role === "official";
                if (!allowed && role === "resident") {
                    try {
                        const volunteerData = await apiRequest("/volunteers");
                        allowed = (volunteerData.volunteers || []).some(v => Number(v.approved) === 1);
                    } catch (_) { allowed = false; }
                }
                if (!allowed) return;
                createPollToolbar.style.display = "flex";
                if (role === "admin") {
                    pollVillageWrap.style.display = "block";
                    const villageData = await apiRequest("/villages");
                    (villageData.villages || []).forEach(v => {
                        const option = document.createElement("option");
                        option.value = v.id;
                        option.textContent = v.name;
                        pollVillageSelect.appendChild(option);
                    });
                } else {
                    document.getElementById("pollVillageHint").textContent = "This poll will be created for your registered village.";
                }
            } catch (error) { console.warn("Could not check poll creation access:", error.message); }
        }

        document.getElementById("showCreatePoll").addEventListener("click", () => createPollPanel.classList.toggle("open"));
        document.getElementById("cancelCreatePoll").addEventListener("click", () => { createPollPanel.classList.remove("open"); createPollForm.reset(); resetPollOptionFields(); });
        document.getElementById("addPollOption").addEventListener("click", () => {
            const count = newPollOptions.querySelectorAll(".new-poll-option").length;
            if (count >= 10) return showMessage("A poll can have at most 10 options.", "error");
            const row = document.createElement("div");
            row.className = "option-row";
            row.innerHTML = `<input class="new-poll-option" maxlength="180" required placeholder="Option ${count + 1}"><button type="button" aria-label="Remove option">Remove</button>`;
            row.querySelector("button").addEventListener("click", () => row.remove());
            newPollOptions.appendChild(row);
        });
        function resetPollOptionFields() {
            newPollOptions.innerHTML = `<label>Answer options * (minimum 2)</label><div class="option-row"><input class="new-poll-option" maxlength="180" required placeholder="Option 1"></div><div class="option-row"><input class="new-poll-option" maxlength="180" required placeholder="Option 2"></div>`;
        }
        createPollForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const options = Array.from(newPollOptions.querySelectorAll(".new-poll-option"))
                .map(input => input.value.trim()).filter(Boolean);
            if (options.length < 2) return showMessage("Enter at least two answer options.", "error");
            if (new Set(options.map(value => value.toLowerCase())).size !== options.length) return showMessage("Answer options must be unique.", "error");
            const button = document.getElementById("savePollButton");
            button.disabled = true; button.textContent = "Creating...";
            const payload = { question: document.getElementById("newPollQuestion").value.trim(), options };
            if (pollVillageWrap.style.display !== "none") payload.village_id = pollVillageSelect.value || null;
            try {
                await apiRequest("/polls", { method: "POST", body: JSON.stringify(payload) });
                showMessage("Poll created successfully.");
                createPollForm.reset(); resetPollOptionFields(); createPollPanel.classList.remove("open");
                await loadPolls();
            } catch (error) { showMessage(error.message, "error"); }
            finally { button.disabled = false; button.textContent = "Create Poll"; }
        });

        searchInput.addEventListener("input", renderPolls);
        statusFilter.addEventListener("change", renderPolls);

        document.addEventListener("DOMContentLoaded", () => {
            if (!token) {
                pollList.innerHTML = `
                    <div class="empty-state">
                        Please log in to view and vote in polls.
                    </div>
                `;
                return;
            }

            setupPollCreator();
            loadPolls();
        });
    </script>
</body>
</html>
