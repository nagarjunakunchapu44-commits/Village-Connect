
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Connect - Polls</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            color: #234b35;
        }

        .page-header p {
            margin: 0;
            color: #666;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .toolbar input,
        .toolbar select {
            flex: 1;
            min-width: 180px;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        .poll-list {
            display: grid;
            gap: 18px;
        }

        .poll-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .poll-card h3 {
            margin: 0 0 10px;
            color: #234b35;
        }

        .poll-meta {
            color: #777;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .poll-question {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .poll-options {
            display: grid;
            gap: 10px;
            margin: 15px 0;
        }

        .poll-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            cursor: pointer;
            background: #fff;
        }

        .poll-option:hover {
            background: #f5faf6;
            border-color: #398451;
        }

        .poll-option input {
            cursor: pointer;
        }

        .poll-option.selected {
            border-color: #398451;
            background: #eef8f0;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 11px 18px;
            background: #287a43;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1f6235;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .vote-button {
            margin-top: 8px;
        }

        .results {
            margin-top: 15px;
        }

        .result-item {
            margin: 12px 0;
        }

        .result-label {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .result-bar {
            height: 10px;
            background: #e6e6e6;
            border-radius: 10px;
            overflow: hidden;
        }

        .result-fill {
            height: 100%;
            background: #398451;
            border-radius: 10px;
            width: 0;
        }

        .my-vote {
            margin-top: 12px;
            padding: 10px;
            background: #eef8f0;
            color: #246b38;
            border-radius: 6px;
            font-size: 14px;
        }

        .message {
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fdecec;
            color: #a12626;
        }

        .message.success {
            display: block;
            background: #eaf7ed;
            color: #246b38;
        }

        .empty-state {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 25px;
            color: #666;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px auto;
                padding: 12px;
            }

            .poll-card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="page-header">
            <h1>Village Polls</h1>
            <p>Share your opinion and vote on important village matters.</p>
        </header>

        <div id="messageBox" class="message"></div>

        <div class="toolbar">
            <input
                type="text"
                id="searchInput"
                placeholder="Search polls..."
            >

            <select id="statusFilter">
                <option value="all">All Polls</option>
                <option value="not-voted">Not Voted</option>
                <option value="voted">Voted</option>
            </select>
        </div>

        <section id="pollList" class="poll-list">
            <div class="loading">Loading polls...</div>
        </section>
    </main>

    <script>
        const API = "http://localhost:5000/api";

        const token = localStorage.getItem("token");

        let allPolls = [];

        const pollList = document.getElementById("pollList");
        const messageBox = document.getElementById("messageBox");
        const searchInput = document.getElementById("searchInput");
        const statusFilter = document.getElementById("statusFilter");

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, function (char) {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                };

                return entities[char];
            });
        }

        function showMessage(message, type = "success") {
            messageBox.textContent = message;
            messageBox.className = "message " + type;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            setTimeout(() => {
                messageBox.className = "message";
                messageBox.textContent = "";
            }, 4000);
        }

        async function apiRequest(url, options = {}) {
            if (!token) {
                throw new Error("Please log in to continue.");
            }

            const response = await fetch(API + url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + token,
                    ...(options.headers || {})
                }
            });

            let data;

            try {
                data = await response.json();
            } catch {
                data = {};
            }

            if (!response.ok || data.success === false) {
                throw new Error(
                    data.message || data.error || "Something went wrong."
                );
            }

            return data;
        }

        async function loadPolls() {
            pollList.innerHTML = '<div class="loading">Loading polls...</div>';

            try {
                const response = await apiRequest("/polls");

                const polls = response.polls || response.data || [];

                if (!Array.isArray(polls)) {
                    throw new Error("Invalid polls response from server.");
                }

                const detailedPolls = [];

                for (const poll of polls) {
                    try {
                        const detailData = await apiRequest(
                            "/polls/" + encodeURIComponent(poll.id)
                        );

                        const fullPoll = detailData.poll || poll;

                        let voteData = {
                            success: true,
                            voted: false,
                            vote: null
                        };

                        try {
                            voteData = await apiRequest(
                                "/polls/" +
                                encodeURIComponent(poll.id) +
                                "/my-vote"
                            );
                        } catch (error) {
                            console.warn(
                                "Could not load user's vote for poll:",
                                poll.id,
                                error
                            );
                        }

                        detailedPolls.push({
                            poll: fullPoll,
                            options: fullPoll.options || [],
                            myVote: voteData.success
                                ? voteData
                                : { voted: false, vote: null }
                        });
                    } catch (error) {
                        console.error(
                            "Could not load poll:",
                            poll.id,
                            error
                        );
                    }
                }

                allPolls = detailedPolls;
                renderPolls();
            } catch (error) {
                console.error(error);

                pollList.innerHTML = `
                    <div class="empty-state">
                        ${escapeHTML(error.message)}
                    </div>
                `;
            }
        }

        function renderPolls() {
            const searchText = searchInput.value.trim().toLowerCase();
            const filter = statusFilter.value;

            const filteredPolls = allPolls.filter(item => {
                const poll = item.poll;
                const voted = Boolean(item.myVote?.voted);

                const matchesSearch =
                    String(poll.question || "")
                        .toLowerCase()
                        .includes(searchText);

                const matchesFilter =
                    filter === "all" ||
                    (filter === "voted" && voted) ||
                    (filter === "not-voted" && !voted);

                return matchesSearch && matchesFilter;
            });

            if (filteredPolls.length === 0) {
                pollList.innerHTML = `
                    <div class="empty-state">
                        No polls found.
                    </div>
                `;
                return;
            }

            pollList.innerHTML = filteredPolls
                .map(createPollCard)
                .join("");
        }

        function createPollCard(item) {
            const poll = item.poll;

            // The backend returns options inside data.poll.options.
            const options = item.options || poll.options || [];

            const myVote = item.myVote || {
                voted: false,
                vote: null
            };

            const voted = Boolean(myVote.voted);

            const totalVotes = options.reduce((total, option) => {
                return total + Number(option.vote_count || 0);
            }, 0);

            const pollQuestion = escapeHTML(poll.question || "Untitled poll");

            const villageName = escapeHTML(
                poll.village_name || "Village"
            );

            const createdAt = poll.created_at
                ? new Date(poll.created_at).toLocaleDateString()
                : "";

            let optionsHTML = "";

            if (!Array.isArray(options) || options.length === 0) {
                optionsHTML = `
                    <p class="empty-state">
                        No voting options are available for this poll.
                    </p>
                `;
            } else if (!voted) {
                optionsHTML = `
                    <div class="poll-options" id="options-${poll.id}">
                        ${options.map(option => `
                            <label class="poll-option">
                                <input
                                    type="radio"
                                    name="poll-${poll.id}"
                                    value="${option.id}"
                                    onchange="selectOption(${poll.id}, this)"
                                >
                                <span>${escapeHTML(option.option_text)}</span>
                            </label>
                        `).join("")}
                    </div>
                `;
            } else {
                optionsHTML = renderResults(options, totalVotes);
            }

            const voteButtonHTML =
                !voted && options.length > 0
                    ? `
                        <button
                            class="vote-button"
                            id="vote-button-${poll.id}"
                            onclick="submitVote(${poll.id})"
                        >
                            Submit Vote
                        </button>
                    `
                    : "";

            const myVoteHTML = voted
                ? `
                    <div class="my-vote">
                        You have already voted in this poll.
                    </div>
                `
                : "";

            return `
                <article class="poll-card">
                    <h3>${pollQuestion}</h3>

                    <div class="poll-meta">
                        Village: ${villageName}
                        ${createdAt ? " | Created: " + escapeHTML(createdAt) : ""}
                    </div>

                    <div class="poll-question">
                        ${pollQuestion}
                    </div>

                    ${optionsHTML}

                    ${voteButtonHTML}

                    ${myVoteHTML}

                    <div class="poll-meta" style="margin-top: 15px;">
                        Total votes: ${totalVotes}
                    </div>
                </article>
            `;
        }

        function renderResults(options, totalVotes) {
            return `
                <div class="results">
                    ${options.map(option => {
                        const count = Number(option.vote_count || 0);

                        const percentage = totalVotes > 0
                            ? Math.round((count / totalVotes) * 100)
                            : 0;

                        return `
                            <div class="result-item">
                                <div class="result-label">
                                    <span>${escapeHTML(option.option_text)}</span>
                                    <span>${count} vote(s) - ${percentage}%</span>
                                </div>

                                <div class="result-bar">
                                    <div
                                        class="result-fill"
                                        style="width: ${percentage}%"
                                    ></div>
                                </div>
                            </div>
                        `;
                    }).join("")}
                </div>
            `;
        }

        function selectOption(pollId, selectedInput) {
            const optionsContainer = document.getElementById(
                "options-" + pollId
            );

            if (!optionsContainer) return;

            optionsContainer
                .querySelectorAll(".poll-option")
                .forEach(label => {
                    label.classList.remove("selected");
                });

            selectedInput.closest(".poll-option")
                ?.classList.add("selected");
        }

        async function submitVote(pollId) {
            const selectedOption = document.querySelector(
                `input[name="poll-${pollId}"]:checked`
            );

            if (!selectedOption) {
                showMessage(
                    "Please select an option before voting.",
                    "error"
                );
                return;
            }

            const button = document.getElementById(
                "vote-button-" + pollId
            );

            if (button) {
                button.disabled = true;
                button.textContent = "Submitting...";
            }

            try {
                await apiRequest(
                    "/polls/" + encodeURIComponent(pollId) + "/vote",
                    {
                        method: "POST",
                        body: JSON.stringify({
                            option_id: Number(selectedOption.value)
                        })
                    }
                );

                showMessage("Your vote has been submitted successfully.");

                await loadPolls();
            } catch (error) {
                showMessage(error.message, "error");

                if (button) {
                    button.disabled = false;
                    button.textContent = "Submit Vote";
                }
            }
        }

        searchInput.addEventListener("input", renderPolls);
        statusFilter.addEventListener("change", renderPolls);

        document.addEventListener("DOMContentLoaded", () => {
            if (!token) {
                pollList.innerHTML = `
                    <div class="empty-state">
                        Please log in to view and vote in polls.
                    </div>
                `;
                return;
            }

            loadPolls();
        });
    </script>
</body>
</html>
