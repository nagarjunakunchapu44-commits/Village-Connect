<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Village Connect - Events</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #166534;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a,
        nav button {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        nav a:hover,
        nav button:hover {
            background: rgba(255,255,255,0.25);
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            margin-bottom: 8px;
            color: #166534;
        }

        .page-title p {
            color: #666;
        }

        .search-box {
            background: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        #message {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .event-card:hover {
            transform: translateY(-3px);
        }

        .event-card h3 {
            margin-top: 0;
            color: #166534;
            font-size: 20px;
        }

        .event-info {
            margin: 10px 0;
            color: #555;
            line-height: 1.6;
        }

        .event-info strong {
            color: #333;
        }

        .event-description {
            color: #666;
            line-height: 1.5;
            margin: 15px 0;
        }

        .participants {
            display: inline-block;
            background: #e8f5e9;
            color: #166534;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .view-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            background: #166534;
            color: white;
            text-decoration: none;
            padding: 11px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .view-btn:hover {
            background: #14532d;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            color: #666;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<header>

    <h1>Village Connect</h1>

    <nav>
        <a href="home.html">Home</a>
        <a href="complaints.html">Complaints</a>
        <a href="villages.html">Villages</a>
        <a href="events.html">Events</a>
        <button onclick="logout()">Logout</button>
    </nav>

</header>


<div class="container">

    <div class="page-title">

        <h2>Village Events</h2>

        <p>
            View upcoming community events and activities in your villages.
        </p>

    </div>


    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search events by title, village, venue or organizer..."
            oninput="filterEvents()"
        >

    </div>


    <div id="message">
        Loading events...
    </div>


    <div
        id="eventsContainer"
        class="events-grid"
    ></div>

</div>


<script>

const token = localStorage.getItem("token");


// ============================================================
// AUTH CHECK
// ============================================================

if (!token) {

    window.location.href = "login.html";

}


// ============================================================
// LOGOUT
// ============================================================

function logout() {

    localStorage.removeItem("token");
    localStorage.removeItem("user");

    window.location.href = "login.html";

}


// ============================================================
// EVENTS DATA
// ============================================================

let allEvents = [];


// ============================================================
// LOAD EVENTS
// ============================================================

async function loadEvents() {

    const message =
        document.getElementById("message");

    const container =
        document.getElementById("eventsContainer");

    try {

        const response =
            await fetch("/api/events", {

                headers: {
                    "Authorization":
                        "Bearer " + token
                }

            });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to fetch events"
            );

        }


        allEvents =
            data.events || [];


        message.style.display =
            "none";


        displayEvents(allEvents);


    } catch (error) {

        console.error(error);

        message.style.display =
            "block";

        message.style.color =
            "red";

        message.textContent =
            error.message ||
            "Unable to fetch events";

        container.innerHTML = "";

    }

}


// ============================================================
// DISPLAY EVENTS
// ============================================================

function displayEvents(events) {

    const container =
        document.getElementById(
            "eventsContainer"
        );


    if (events.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h3>No events found</h3>
                <p>
                    There are currently no events available.
                </p>
            </div>
        `;

        return;

    }


    container.innerHTML =
        events.map(event => {

            const date =
                formatDate(event.date);

            const time =
                event.time
                    ? formatTime(event.time)
                    : "Time not specified";


            const village =
                event.village_name ||
                "Village not specified";


            const venue =
                event.venue ||
                "Venue not specified";


            const organizer =
                event.organizer ||
                "Not specified";


            const description =
                event.description ||
                "No description available.";


            const participants =
                event.participant_count || 0;


            return `

                <div class="event-card">

                    <h3>
                        ${escapeHtml(event.title)}
                    </h3>


                    <div class="event-info">

                        <div>
                            <strong>📅 Date:</strong>
                            ${date}
                        </div>


                        <div>
                            <strong>⏰ Time:</strong>
                            ${time}
                        </div>


                        <div>
                            <strong>📍 Venue:</strong>
                            ${escapeHtml(venue)}
                        </div>


                        <div>
                            <strong>🏘️ Village:</strong>
                            ${escapeHtml(village)}
                        </div>


                        <div>
                            <strong>👤 Organizer:</strong>
                            ${escapeHtml(organizer)}
                        </div>

                    </div>


                    <div class="event-description">

                        ${escapeHtml(description)}

                    </div>


                    <div class="participants">

                        👥 ${participants}
                        participant${participants == 1 ? "" : "s"}

                    </div>


                    <a
                        class="view-btn"
                        href="event-details.html?id=${event.id}"
                    >
                        View Event Details
                    </a>

                </div>

            `;

        }).join("");

}


// ============================================================
// SEARCH / FILTER
// ============================================================

function filterEvents() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();


    if (!search) {

        displayEvents(allEvents);

        return;

    }


    const filtered =
        allEvents.filter(event => {

            return (

                (event.title || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (event.description || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (event.village_name || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (event.venue || "")
                    .toLowerCase()
                    .includes(search)

                ||

                (event.organizer || "")
                    .toLowerCase()
                    .includes(search)

            );

        });


    displayEvents(filtered);

}


// ============================================================
// DATE FORMAT
// ============================================================

function formatDate(dateString) {

    if (!dateString) {

        return "Date not specified";

    }


    const date =
        new Date(dateString);


    if (isNaN(date.getTime())) {

        return dateString;

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


// ============================================================
// TIME FORMAT
// ============================================================

function formatTime(timeString) {

    if (!timeString) {

        return "Time not specified";

    }


    const parts =
        timeString
            .toString()
            .split(":");


    if (parts.length < 2) {

        return timeString;

    }


    let hours =
        parseInt(parts[0]);


    const minutes =
        parts[1];


    const ampm =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12 || 12;


    return `${hours}:${minutes} ${ampm}`;

}


// ============================================================
// HTML ESCAPE
// ============================================================

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


// ============================================================
// START
// ============================================================

loadEvents();

</script>

</body>
</html>
