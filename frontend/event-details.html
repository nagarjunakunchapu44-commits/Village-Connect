<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Village Connect - Event Details</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #166534;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a,
        nav button {
            color: white;
            text-decoration: none;

            background: rgba(255, 255, 255, 0.15);

            border: none;
            padding: 9px 14px;

            border-radius: 6px;

            cursor: pointer;
            font-size: 14px;
        }

        nav a:hover,
        nav button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .back-link {
            display: inline-block;

            color: #166534;
            text-decoration: none;

            margin-bottom: 20px;

            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .event-card {
            background: white;

            border-radius: 12px;

            padding: 30px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .event-title {
            color: #166534;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .event-description {
            color: #555;
            font-size: 16px;
            line-height: 1.7;

            margin: 20px 0;
        }

        .details-grid {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 15px;

            margin: 25px 0;
        }

        .detail-box {
            background: #f8faf9;

            border: 1px solid #e2e8e4;

            border-radius: 8px;

            padding: 16px;
        }

        .detail-box .label {
            color: #666;

            font-size: 13px;

            margin-bottom: 6px;
        }

        .detail-box .value {
            color: #222;

            font-size: 16px;

            font-weight: bold;
        }

        .participants-box {
            background: #e8f5e9;

            color: #166534;

            padding: 15px;

            border-radius: 8px;

            margin: 20px 0;

            font-weight: bold;
        }

        .village-section {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #ddd;
        }

        .village-section h3 {
            color: #166534;
        }

        .action-section {
            margin-top: 30px;

            padding-top: 25px;

            border-top: 1px solid #ddd;

            text-align: center;
        }

        .register-btn,
        .cancel-btn {
            border: none;

            padding: 13px 25px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;
        }

        .register-btn {
            background: #166534;
            color: white;
        }

        .register-btn:hover {
            background: #14532d;
        }

        .cancel-btn {
            background: #dc2626;
            color: white;
        }

        .cancel-btn:hover {
            background: #b91c1c;
        }

        .status-message {
            margin-top: 15px;

            font-weight: bold;

            min-height: 20px;
        }

        .loading {
            text-align: center;

            padding: 40px;

            color: #666;
        }

        .error {
            text-align: center;

            padding: 40px;

            color: #dc2626;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            .container {
                width: 94%;
            }

            .event-card {
                padding: 20px;
            }

            .event-title {
                font-size: 24px;
            }
        }
    </style>
</head>


<body>

<header>

    <h1>Village Connect</h1>

    <nav>

        <a href="home.html">
            Home
        </a>

        <a href="complaints.html">
            Complaints
        </a>

        <a href="villages.html">
            Villages
        </a>

        <a href="events.html">
            Events
        </a>

        <button onclick="logout()">
            Logout
        </button>

    </nav>

</header>


<div class="container">

    <a
        href="events.html"
        class="back-link"
    >
        ← Back to Events
    </a>


    <div id="loading" class="loading">
        Loading event details...
    </div>


    <div
        id="error"
        class="error hidden"
    ></div>


    <div
        id="eventContainer"
        class="event-card hidden"
    >

        <h2
            id="eventTitle"
            class="event-title"
        ></h2>


        <div
            id="eventDescription"
            class="event-description"
        ></div>


        <div class="details-grid">

            <div class="detail-box">

                <div class="label">
                    Date
                </div>

                <div
                    id="eventDate"
                    class="value"
                ></div>

            </div>


            <div class="detail-box">

                <div class="label">
                    Time
                </div>

                <div
                    id="eventTime"
                    class="value"
                ></div>

            </div>


            <div class="detail-box">

                <div class="label">
                    Venue
                </div>

                <div
                    id="eventVenue"
                    class="value"
                ></div>

            </div>


            <div class="detail-box">

                <div class="label">
                    Organizer
                </div>

                <div
                    id="eventOrganizer"
                    class="value"
                ></div>

            </div>

        </div>


        <div class="participants-box">

            👥 Participants:

            <span id="participantCount">
                0
            </span>

        </div>


        <div
            id="villageSection"
            class="village-section"
        >

            <h3>
                🏘️ Village Information
            </h3>


            <div class="details-grid">

                <div class="detail-box">

                    <div class="label">
                        Village
                    </div>

                    <div
                        id="villageName"
                        class="value"
                    ></div>

                </div>


                <div class="detail-box">

                    <div class="label">
                        District
                    </div>

                    <div
                        id="villageDistrict"
                        class="value"
                    ></div>

                </div>


                <div class="detail-box">

                    <div class="label">
                        State
                    </div>

                    <div
                        id="villageState"
                        class="value"
                    ></div>

                </div>

            </div>

        </div>


        <div class="action-section">

            <button
                id="registerButton"
                class="register-btn"
                onclick="registerEvent()"
            >
                Register for Event
            </button>


            <button
                id="cancelButton"
                class="cancel-btn hidden"
                onclick="cancelRegistration()"
            >
                Cancel Registration
            </button>


            <div
                id="statusMessage"
                class="status-message"
            ></div>

        </div>

    </div>

</div>


<script>

const token =
    localStorage.getItem("token");


// ============================================================
// AUTH CHECK
// ============================================================

if (!token) {

    window.location.href =
        "login.html";

}


// ============================================================
// GET EVENT ID FROM URL
// ============================================================

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const eventId =
    urlParams.get("id");


if (!eventId) {

    showError(
        "Event ID is missing."
    );

}


// ============================================================
// LOGOUT
// ============================================================

function logout() {

    localStorage.removeItem("token");

    localStorage.removeItem("user");

    window.location.href =
        "login.html";

}


// ============================================================
// LOAD EVENT
// ============================================================

async function loadEvent() {

    if (!eventId) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/events/${eventId}`,
                {
                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to fetch event"
            );

        }


        displayEvent(
            data.event
        );


    } catch (error) {

        console.error(error);

        showError(
            error.message ||
            "Unable to load event details."
        );

    }

}


// ============================================================
// DISPLAY EVENT
// ============================================================

function displayEvent(event) {

    document.getElementById(
        "loading"
    ).classList.add("hidden");


    document.getElementById(
        "eventContainer"
    ).classList.remove("hidden");


    document.getElementById(
        "eventTitle"
    ).textContent =
        event.title || "Untitled Event";


    document.getElementById(
        "eventDescription"
    ).textContent =
        event.description ||
        "No description available.";


    document.getElementById(
        "eventDate"
    ).textContent =
        formatDate(event.date);


    document.getElementById(
        "eventTime"
    ).textContent =
        event.time
            ? formatTime(event.time)
            : "Time not specified";


    document.getElementById(
        "eventVenue"
    ).textContent =
        event.venue ||
        "Venue not specified";


    document.getElementById(
        "eventOrganizer"
    ).textContent =
        event.organizer ||
        "Not specified";


    document.getElementById(
        "participantCount"
    ).textContent =
        event.participant_count || 0;


    document.getElementById(
        "villageName"
    ).textContent =
        event.village_name ||
        "Not specified";


    document.getElementById(
        "villageDistrict"
    ).textContent =
        event.district ||
        "Not specified";


    document.getElementById(
        "villageState"
    ).textContent =
        event.state ||
        "Not specified";


    // --------------------------------------------------------
    // REGISTRATION STATUS
    // --------------------------------------------------------

    const registerButton =
        document.getElementById(
            "registerButton"
        );


    const cancelButton =
        document.getElementById(
            "cancelButton"
        );


    if (event.user_registered) {

        registerButton.classList.add(
            "hidden"
        );

        cancelButton.classList.remove(
            "hidden"
        );

    } else {

        registerButton.classList.remove(
            "hidden"
        );

        cancelButton.classList.add(
            "hidden"
        );

    }

}
// ============================================================
// REGISTER FOR EVENT
// ============================================================

async function registerEvent() {

    const button =
        document.getElementById(
            "registerButton"
        );

    const statusMessage =
        document.getElementById(
            "statusMessage"
        );


    button.disabled = true;

    button.textContent =
        "Registering...";

    statusMessage.textContent =
        "";


    try {

        const response =
            await fetch(
                `/api/events/${eventId}/register`,
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Registration failed"
            );

        }


        statusMessage.style.color =
            "#166534";

        statusMessage.textContent =
            data.message ||
            "Successfully registered for the event.";


        button.classList.add(
            "hidden"
        );


        document.getElementById(
            "cancelButton"
        ).classList.remove(
            "hidden"
        );


        await loadEvent();

    } catch (error) {

        console.error(error);

        statusMessage.style.color =
            "#dc2626";

        statusMessage.textContent =
            error.message ||
            "Unable to register for event.";

    }


    button.disabled = false;

    button.textContent =
        "Register for Event";

}


// ============================================================
// CANCEL REGISTRATION
// ============================================================

async function cancelRegistration() {

    const button =
        document.getElementById(
            "cancelButton"
        );

    const statusMessage =
        document.getElementById(
            "statusMessage"
        );


    const confirmCancel =
        confirm(
            "Are you sure you want to cancel your registration?"
        );


    if (!confirmCancel) {
        return;
    }


    button.disabled = true;

    button.textContent =
        "Cancelling...";

    statusMessage.textContent =
        "";


    try {

        const response =
            await fetch(
                `/api/events/${eventId}/register`,
                {
                    method: "DELETE",

                    headers: {
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Cancellation failed"
            );

        }


        statusMessage.style.color =
            "#166534";

        statusMessage.textContent =
            data.message ||
            "Registration cancelled successfully.";


        button.classList.add(
            "hidden"
        );


        document.getElementById(
            "registerButton"
        ).classList.remove(
            "hidden"
        );


        await loadEvent();

    } catch (error) {

        console.error(error);

        statusMessage.style.color =
            "#dc2626";

        statusMessage.textContent =
            error.message ||
            "Unable to cancel registration.";

    }


    button.disabled = false;

    button.textContent =
        "Cancel Registration";

}


// ============================================================
// ERROR
// ============================================================

function showError(message) {

    document.getElementById(
        "loading"
    ).classList.add("hidden");


    const error =
        document.getElementById(
            "error"
        );


    error.classList.remove(
        "hidden"
    );


    error.textContent =
        message;

}


// ============================================================
// DATE FORMAT
// ============================================================

function formatDate(dateString) {

    if (!dateString) {

        return "Date not specified";

    }


    const date =
        new Date(dateString);


    if (isNaN(date.getTime())) {

        return dateString;

    }


    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


// ============================================================
// TIME FORMAT
// ============================================================

function formatTime(timeString) {

    if (!timeString) {

        return "Time not specified";

    }


    const parts =
        timeString
            .toString()
            .split(":");


    if (parts.length < 2) {

        return timeString;

    }


    let hours =
        parseInt(parts[0]);


    const minutes =
        parts[1];


    const ampm =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12 || 12;


    return `${hours}:${minutes} ${ampm}`;

}


// ============================================================
// START
// ============================================================

loadEvent();

</script>

</body>

</html>
