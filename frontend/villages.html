
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Village - Village Connect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7ed;
            color: #26351f;
        }

        nav {
            background: #31572c;
            color: white;
            padding: 16px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        h1, h2 {
            color: #31572c;
            margin-bottom: 15px;
        }

        .village-name {
            font-size: 28px;
            font-weight: bold;
            color: #31572c;
            margin: 10px 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat {
            background: #f5f7ed;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            color: #31572c;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .info {
            line-height: 1.8;
        }

        .empty {
            color: #777;
            padding: 15px 0;
        }

        .error {
            background: #ffe5e5;
            color: #a40000;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #e5f3df;
            color: #31572c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .complaint {
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        .complaint:last-child {
            border-bottom: none;
        }

        .status {
            font-weight: bold;
            color: #31572c;
        }

        .attribution {
            margin-top: 12px;
            font-size: 12px;
            color: #777;
        }

        .attribution a {
            color: #31572c;
        }

        .village-selector {
            margin: 15px 0 20px;
        }

        .village-selector label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #31572c;
        }

        select, input {
            width: 100%;
            padding: 11px;
            border: 1px solid #b8c9ad;
            border-radius: 7px;
            font-size: 15px;
            background: white;
            color: #26351f;
        }

        .village-selector select {
            max-width: 450px;
        }

        .office-phone {
            margin-top: 8px;
        }

        .office-phone input {
            max-width: 260px;
            margin-top: 6px;
        }

        .office-actions {
            margin-top: 10px;
        }

        .save-btn {
            background: #31572c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        .save-btn:hover {
            background: #244421;
        }

        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .admin-label {
            display: inline-block;
            background: #e5efdf;
            color: #31572c;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            nav {
                padding: 15px 5%;
            }

            nav a {
                margin-left: 0;
                margin-right: 12px;
            }

            .container {
                width: 92%;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">🌱 Village Connect</div>

    <div>
        <a href="/home.html">Home</a>
        <a href="/map.html">Map</a>
        <a href="/chat.html">Chat</a>
        <a href="/analytics.html">Analytics</a>
    </div>
</nav>

<div class="container">

    <div id="loading" class="card">
        Loading village information...
    </div>

    <div id="error" class="error" style="display:none;"></div>
    <div id="success" class="success" style="display:none;"></div>

    <div id="content" style="display:none;">

        <div class="card">
            <h1>🏡 My Village</h1>

            <div id="adminSelector" class="village-selector" style="display:none;">
                <span class="admin-label">Administrator Access</span>

                <label for="villageSelect">Select Village</label>

                <select id="villageSelect">
                    <option value="">Loading villages...</option>
                </select>
            </div>

            <div id="villageName" class="village-name"></div>
            <div id="villageInfo" class="info"></div>

            <div class="attribution">
                Location data ©
                <a href="https://www.openstreetmap.org/copyright"
                   target="_blank" rel="noopener noreferrer">
                    OpenStreetMap contributors
                </a>.
                Data is available under the
                <a href="https://opendatacommons.org/licenses/odbl/"
                   target="_blank" rel="noopener noreferrer">
                    Open Database License (ODbL)
                </a>.
            </div>
        </div>

        <div class="card">
            <h2>Village Statistics</h2>
            <div id="stats" class="grid"></div>
        </div>

        <div class="card">
            <h2>Recent Complaints</h2>
            <div id="complaints"></div>
        </div>

        <div class="card">
            <h2>Village Offices</h2>
            <div id="offices"></div>
        </div>

    </div>
</div>

<script>
    const token = localStorage.getItem("token");

    let currentUser = null;
    let isAdmin = false;
    let currentVillageId = null;

    if (!token) {
        window.location.href = "/login.html";
    }

    // --------------------------------------------------
    // API helper
    // --------------------------------------------------

    async function apiRequest(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                "Authorization": "Bearer " + token,
                ...(options.headers || {})
            }
        });

        let data;

        try {
            data = await response.json();
        } catch {
            throw new Error("Invalid server response.");
        }

        if (!response.ok || data.success === false) {
            throw new Error(
                data.message || "Unable to complete the request."
            );
        }

        return data;
    }

    // --------------------------------------------------
    // Start page
    // --------------------------------------------------

    async function loadMyVillage() {
        try {
            const meData = await apiRequest("/api/auth/me");

            currentUser = meData.user;

            if (!currentUser) {
                throw new Error("User information was not returned.");
            }

            isAdmin =
                String(currentUser.role || "").toLowerCase() === "admin";

            document.getElementById("loading").style.display = "none";
            document.getElementById("content").style.display = "block";

            if (isAdmin) {
                await loadAdminVillages();
            } else {
                const villageId = Number(currentUser.village_id);

                if (!Number.isInteger(villageId) || villageId <= 0) {
                    throw new Error(
                        "Your account is not linked to a village. Please contact your administrator."
                    );
                }

                await loadVillageDetails(villageId);
            }

        } catch (error) {
            showError(error.message);
            document.getElementById("loading").style.display = "none";
        }
    }

    // --------------------------------------------------
    // Admin village selector
    // --------------------------------------------------

    async function loadAdminVillages() {
        const selector = document.getElementById("adminSelector");
        const select = document.getElementById("villageSelect");

        selector.style.display = "block";

        const data = await apiRequest("/api/villages");

        const villages = Array.isArray(data.villages)
            ? data.villages
            : [];

        if (villages.length === 0) {
            throw new Error("No villages are available.");
        }

        select.innerHTML = '<option value="">-- Select a village --</option>';

        villages.forEach(village => {
            const option = document.createElement("option");
            option.value = village.id;
            option.textContent = village.name;
            select.appendChild(option);
        });

        select.addEventListener("change", async function () {
            const villageId = Number(this.value);

            if (!Number.isInteger(villageId) || villageId <= 0) {
                currentVillageId = null;
                clearVillageDetails();
                return;
            }

            try {
                await loadVillageDetails(villageId);
            } catch (error) {
                showError(error.message);
            }
        });
    }

    // --------------------------------------------------
    // Load village details
    // --------------------------------------------------

    async function loadVillageDetails(villageId) {
        clearMessages();

        currentVillageId = villageId;

        document.getElementById("villageName").textContent =
            "Loading village...";

        const data = await apiRequest(
            `/api/villages/${villageId}`
        );

        const village = data.village;

        if (!village) {
            throw new Error("Village information was not returned.");
        }

        document.getElementById("villageName").textContent =
            village.name || "Village";

        const latitude = village.latitude ?? "-";
        const longitude = village.longitude ?? "-";

        document.getElementById("villageInfo").innerHTML = `
            <b>District:</b> ${escapeHtml(village.district || "-")}<br>
            <b>State:</b> ${escapeHtml(village.state || "-")}<br>
            <b>Latitude:</b> ${escapeHtml(latitude)}<br>
            <b>Longitude:</b> ${escapeHtml(longitude)}
        `;

        // Statistics.
        const statistics = village.statistics || {};

        document.getElementById("stats").innerHTML = `
            <div class="stat">
                <div class="stat-number">
                    ${Number(statistics.total_complaints || 0)}
                </div>
                <div class="stat-label">Total Complaints</div>
            </div>

            <div class="stat">
                <div class="stat-number">
                    ${Number(statistics.resolved_complaints || 0)}
                </div>
                <div class="stat-label">Resolved</div>
            </div>

            <div class="stat">
                <div class="stat-number">
                    ${Number(statistics.pending_complaints || 0)}
                </div>
                <div class="stat-label">Pending</div>
            </div>

            <div class="stat">
                <div class="stat-number">
                    ${Number(village.total_residents || 0)}
                </div>
                <div class="stat-label">Residents</div>
            </div>
        `;

        // Recent complaints.
        const recent = Array.isArray(data.recent_complaints)
            ? data.recent_complaints
            : [];

        if (recent.length === 0) {
            document.getElementById("complaints").innerHTML = `
                <div class="empty">
                    No recent complaint details are available.
                </div>
            `;
        } else {
            document.getElementById("complaints").innerHTML =
                recent.map(complaint => `
                    <div class="complaint">
                        <b>${escapeHtml(
                            complaint.complaint_number || "Complaint"
                        )}</b><br>

                        Category: ${escapeHtml(complaint.category || "-")}<br>

                        Status:
                        <span class="status">
                            ${escapeHtml(complaint.status || "-")}
                        </span><br>

                        Area: ${escapeHtml(complaint.area || "-")}
                    </div>
                `).join("");
        }

        // Offices.
        renderOffices(data.offices || []);

        clearMessages();
    }

    // --------------------------------------------------
    // Render offices
    // Admin sees editable phone fields.
    // Other users see read-only phone numbers.
    // --------------------------------------------------

    function renderOffices(offices) {
        const container = document.getElementById("offices");

        if (!Array.isArray(offices) || offices.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    No office details are available for this village.
                </div>
            `;
            return;
        }

        container.innerHTML = offices.map(office => {
            const phone = office.contact_phone || "";

            if (isAdmin) {
                return `
                    <div class="complaint">
                        <b>${escapeHtml(office.name || "-")}</b><br>

                        Type:
                        ${escapeHtml(office.office_type || "-")}

                        <div class="office-phone">
                            <label for="office-phone-${Number(office.id)}">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="office-phone-${Number(office.id)}"
                                maxlength="15"
                                value="${escapeHtml(phone)}"
                                placeholder="Enter office phone number"
                            >
                        </div>

                        <div class="office-actions">
                            <button
                                type="button"
                                class="save-btn"
                                onclick="saveOfficePhone(${Number(office.id)})"
                            >
                                Save Phone Number
                            </button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="complaint">
                    <b>${escapeHtml(office.name || "-")}</b><br>

                    Type:
                    ${escapeHtml(office.office_type || "-")}<br>

                    Phone:
                    ${escapeHtml(phone || "-")}
                </div>
            `;
        }).join("");
    }

    // --------------------------------------------------
    // Admin: Save office phone number
    // --------------------------------------------------

    async function saveOfficePhone(officeId) {
        if (!isAdmin) {
            showError("Only administrators can change office phone numbers.");
            return;
        }

        const input = document.getElementById(
            `office-phone-${officeId}`
        );

        if (!input) {
            showError("Phone number field not found.");
            return;
        }

        const phone = input.value.trim();

        if (phone.length > 15) {
            showError("Phone number cannot exceed 15 characters.");
            return;
        }

        const buttons = document.querySelectorAll(".save-btn");

        buttons.forEach(button => button.disabled = true);

        try {
            const result = await apiRequest(
                `/api/offices/${officeId}`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contact_phone: phone || null
                    })
                }
            );

            showSuccess(
                result.message || "Office phone number updated successfully."
            );

            // Reload selected village so the saved value is displayed.
            if (currentVillageId) {
                await loadVillageDetails(currentVillageId);
                showSuccess("Office phone number updated successfully.");
            }

        } catch (error) {
            showError(error.message);
        } finally {
            buttons.forEach(button => button.disabled = false);
        }
    }

    // --------------------------------------------------
    // Clear village information
    // --------------------------------------------------

    function clearVillageDetails() {
        document.getElementById("villageName").textContent =
            "Select a village";

        document.getElementById("villageInfo").innerHTML = "";
        document.getElementById("stats").innerHTML = "";

        document.getElementById("complaints").innerHTML = "";
        document.getElementById("offices").innerHTML = "";
    }

    // --------------------------------------------------
    // Messages
    // --------------------------------------------------

    function showError(message) {
        const errorBox = document.getElementById("error");

        errorBox.textContent = message;
        errorBox.style.display = "block";

        document.getElementById("success").style.display = "none";
    }

    function showSuccess(message) {
        const successBox = document.getElementById("success");

        successBox.textContent = message;
        successBox.style.display = "block";

        document.getElementById("error").style.display = "none";
    }

    function clearMessages() {
        document.getElementById("error").style.display = "none";
        document.getElementById("success").style.display = "none";
    }

    // --------------------------------------------------
    // HTML escaping
    // --------------------------------------------------

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    if (token) {
        loadMyVillage();
    }
</script>

</body>
</html>
