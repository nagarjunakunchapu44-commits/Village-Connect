<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints - Village Connect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0fdf4;
            color: #1f2937;
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            color: #166534;
            font-size: 28px;
        }

        .button {
            display: inline-block;
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            background: #15803d;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .button:hover {
            background: #166534;
        }

        .back-button {
            background: #475569;
        }

        .back-button:hover {
            background: #334155;
        }

        #message {
            padding: 16px;
            margin-bottom: 18px;
            background: white;
            border: 1px solid #dcfce7;
            border-radius: 9px;
            color: #475569;
            line-height: 1.5;
        }

        .complaints-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .complaint {
            padding: 22px;
            background: white;
            border: 1px solid #dcfce7;
            border-left: 5px solid #16a34a;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .complaint:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.10);
        }

        .complaint-number {
            color: #166534;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .category {
            margin-bottom: 9px;
            font-size: 15px;
        }

        .severity {
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        .description {
            margin-top: 12px;
            color: #475569;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            margin-top: 15px;
            padding: 7px 13px;
            border-radius: 20px;
            background: #fef3c7;
            color: #92400e;
            font-size: 13px;
            font-weight: bold;
        }

        .status.resolved {
            background: #dcfce7;
            color: #166534;
        }

        .status.progress {
            background: #dbeafe;
            color: #1e40af;
        }

        .status.forwarded {
            background: #f3e8ff;
            color: #6b21a8;
        }

        .date {
            margin-top: 14px;
            color: #64748b;
            font-size: 13px;
        }

        .empty-message {
            text-align: center;
            padding: 35px 20px;
            background: white;
            border: 1px solid #dcfce7;
            border-radius: 10px;
            color: #64748b;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                margin: 15px auto;
            }

            .top-bar {
                align-items: stretch;
                flex-direction: column;
            }

            h1 {
                font-size: 24px;
            }

            .button {
                text-align: center;
            }

            .complaint {
                padding: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="top-bar">
            <h1>My Complaints</h1>

            <div>
                <a href="home.html" class="button back-button">
                    ← Back to Home
                </a>

                <a href="report-complaint.html" class="button">
                    + Report New Problem
                </a>
            </div>
        </div>

        <div id="message">
            Loading complaints...
        </div>

        <div id="complaints" class="complaints-list"></div>

    </div>

    <script>
        async function loadComplaints() {
            const token = localStorage.getItem("token");
            const message = document.getElementById("message");
            const complaintsContainer = document.getElementById("complaints");

            message.style.display = "block";
            message.style.color = "#475569";
            message.textContent = "Loading complaints...";
            complaintsContainer.innerHTML = "";

            if (!token) {
                message.style.color = "#dc2626";
                message.textContent = "Please login first.";
                return;
            }

            try {
                const response = await fetch("/api/complaints/my", {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    message.style.color = "#dc2626";
                    message.textContent =
                        data.message || "Unable to load complaints.";
                    return;
                }

                if (!Array.isArray(data.complaints) ||
                    data.complaints.length === 0) {
                    message.className = "empty-message";
                    message.textContent =
                        "You have not submitted any complaints yet.";
                    return;
                }

                message.style.display = "none";

                data.complaints.forEach(function(complaint) {
                    const card = document.createElement("div");
                    card.className = "complaint";
                    card.tabIndex = 0;
                    card.setAttribute("role", "link");
                    card.setAttribute(
                        "aria-label",
                        `View complaint ${complaint.complaint_number || complaint.id}`
                    );

                    card.addEventListener("click", function() {
                        window.location.href =
                            `complaint-details.html?id=${encodeURIComponent(complaint.id)}`;
                    });

                    card.addEventListener("keydown", function(event) {
                        if (event.key === "Enter" || event.key === " ") {
                            event.preventDefault();
                            card.click();
                        }
                    });

                    const number = document.createElement("div");
                    number.className = "complaint-number";
                    number.textContent =
                        complaint.complaint_number || `Complaint #${complaint.id}`;

                    const category = document.createElement("div");
                    category.className = "category";
                    category.textContent = `Category: ${complaint.category || "Not specified"}`;

                    const severity = document.createElement("div");
                    severity.className = "severity";
                    severity.textContent = `Severity: ${complaint.severity || "Not specified"}`;

                    const description = document.createElement("div");
                    description.className = "description";
                    description.textContent =
                        complaint.description || "No description provided.";

                    const status = document.createElement("div");
                    status.className = "status";

                    const statusText = String(complaint.status || "Pending");
                    status.textContent = statusText;

                    const normalizedStatus = statusText.toLowerCase();

                    if (normalizedStatus === "resolved" ||
                        normalizedStatus === "completed") {
                        status.classList.add("resolved");
                    } else if (normalizedStatus.includes("progress")) {
                        status.classList.add("progress");
                    } else if (normalizedStatus === "forwarded") {
                        status.classList.add("forwarded");
                    }

                    const date = document.createElement("div");
                    date.className = "date";

                    const submittedDate = complaint.created_at
                        ? new Date(complaint.created_at)
                        : null;

                    date.textContent =
                        "Submitted: " +
                        (submittedDate && !isNaN(submittedDate.getTime())
                            ? submittedDate.toLocaleString()
                            : "Date unavailable");

                    card.appendChild(number);
                    card.appendChild(category);
                    card.appendChild(severity);
                    card.appendChild(description);
                    card.appendChild(status);
                    card.appendChild(date);

                    complaintsContainer.appendChild(card);
                });

            } catch (error) {
                console.error("Error loading complaints:", error);
                message.style.display = "block";
                message.style.color = "#dc2626";
                message.textContent =
                    "Unable to connect to server. Please try again.";
            }
        }

        loadComplaints();
    </script>

</body>
</html>
